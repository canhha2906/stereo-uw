name: agg2d_ctx
backbone: v2_imagenet
agg: 2d
res: 8
d_max: 192
groups: 8
feat_channels: 32
use_context: true
context_channels: 32
context_pretrained: true
crop_h: 256
crop_w: 512
batch_size: 8
num_workers: 0
amp: true

pretrain:
  lr: 1.0e-3
  epochs: 10
  warmup_iters: 500
  weight_decay: 1.0e-4

finetune:
  lr: 1.0e-4
  epochs: 10
  weight_decay: 1.0e-4

deploy:
  input_h: 480
  input_w: 640
  precision: fp16
